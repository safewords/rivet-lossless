[package]
name = "rivet-lossless"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-lossless"
homepage = "https://github.com/safewords/rivet-lossless"
documentation = "https://docs.rs/rivet-lossless"
authors = ["Ely Erin Fox"]
description = "FLAC and ALAC (Apple Lossless) encoders and decoders in Rust, written from RFC 9639 and the published ALAC format description: no C, no system libraries, no build script. FLAC at 4-32 bits and ALAC at 16, 20, 24 and 32 bits, 1-8 channels, integer PCM in and out. rivet's lossless audio codecs. Imported as `lossless`."
keywords = ["flac", "alac", "lossless", "audio", "codec"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/"]

[lib]
name = "lossless"

[features]
# Compile out the run-time selection of the AVX2 code paths, leaving only
# the baseline build of every kernel (for testing the fallback).
force-scalar = []

[dependencies]
thiserror = "2"
